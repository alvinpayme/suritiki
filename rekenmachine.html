<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suritiki - Interne Rekenmachine</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; color: white; }
        .card { background: #1e293b; width: 100%; max-width: 400px; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); box-sizing: border-box; border: 1px solid #334155; }
        h1 { color: #10b981; margin: 0 0 4px 0; font-size: 24px; font-weight: 800; text-align: center; }
        p { color: #94a3b8; font-size: 14px; margin: 0 0 24px 0; text-align: center; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 14px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid #334155; background: #0f172a; color: white; border-radius: 8px; font-size: 15px; outline: none; box-sizing: border-box; }
        input:focus, select:focus { border-color: #10b981; }
        .result-box { background: #0f172a; border: 1px solid #10b981; padding: 16px; border-radius: 12px; margin-top: 20px; text-align: center; }
        .result-title { color: #10b981; font-weight: 700; margin: 0 0 4px 0; }
        .amount { font-size: 32px; font-weight: 800; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Suritiki Paneel</h1>
        <p>Jouw geheime rekenmachine achter de schermen.</p>
        
        <div class="form-group">
            <label>In te voeren SRD Bedrag</label>
            <input type="number" id="srdAmount" placeholder="Bijv. 8000" oninput="berekenEuro()">
        </div>

        <div class="form-group">
            <label>Jouw Winst-Wisselkoers</label>
            <input type="number" id="koers" value="41.50" step="0.1" oninput="berekenEuro()">
        </div>

        <div class="form-group">
            <label>Transactie Fee (Winst)</label>
            <input type="number" id="fee" value="3.00" step="0.5" oninput="berekenEuro()">
        </div>

        <div class="result-box">
            <div class="result-title">Totaal bedrag voor je Tikkie:</div>
            <div class="amount" id="totaalEuro">€ 3,00</div>
        </div>
    </div>

    <script>
        function berekenEuro() {
            const srd = parseFloat(document.getElementById('srdAmount').value) || 0;
            const koers = parseFloat(document.getElementById('koers').value) || 41.50;
            const fee = parseFloat(document.getElementById('fee').value) || 0;
            
            if(srd === 0) {
                document.getElementById('totaalEuro').innerText = `€ ${fee.toFixed(2)}`;
                return;
            }
            
            // Berekening: SRD delen door je eigen koers + de vaste fee winst!
            const euro = (srd / koers) + fee;
            document.getElementById('totaalEuro').innerText = `€ ${euro.toFixed(2)}`;
        }
    </script>
</body>
</html>
