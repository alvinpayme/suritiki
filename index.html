<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suritiki - Maak betaalverzoek</title>
    <style>
        :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #334155; }
        * { box-sizing: border-box; }
        body { margin: 0; background: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .card { background: #fff; width: 100%; max-width: 420px; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(15, 23, 42, .12); }
        h1 { color: #059669; margin: 0 0 4px; font-size: 30px; }
        .intro { color: #64748b; font-size: 14px; margin: 0 0 24px; }
        .field { margin-bottom: 16px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
        input, select { width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 12px; font: inherit; }
        input:focus, select:focus { outline: 2px solid #34d399; border-color: #10b981; }
        .amount-row { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
        button, .whatsapp { width: 100%; border: 0; border-radius: 10px; padding: 12px; font: inherit; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none; display: block; }
        .submit { background: #059669; color: #fff; }
        .submit:hover { background: #047857; }
        button:disabled { opacity: .65; cursor: wait; }
        .result { margin-top: 24px; padding: 16px; background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 12px; }
        .hidden { display: none; }
        .result-title { color: #065f46; font-weight: 700; margin: 0 0 8px; }
        #generatedLink { background: #fff; font-family: monospace; font-size: 12px; margin-bottom: 10px; }
        .copy { background: #1e293b; color: #fff; margin-bottom: 10px; }
        .whatsapp { background: #25d366; color: #fff; }
        .whatsapp:hover { background: #1da851; }
        .message { margin: 12px 0 0; color: #b91c1c; font-size: 14px; font-weight: 600; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Suritiki</h1>
        <p class="intro">Maak makkelijk een betaalverzoek voor Suriname en Nederland.</p>

        <form id="paymentForm">
            <div class="field">
                <label for="name">Jouw naam (ontvanger)</label>
                <input type="text" id="name" required placeholder="Bijv. Deelsy">
            </div>
            <div class="field">
                <label for="amount">Bedrag</label>
                <div class="amount-row">
                    <input type="number" id="amount" required min="0.01" step="0.01" placeholder="0,00">
                    <select id="currency" aria-label="Valuta">
                        <option value="SRD">SRD</option>
                        <option value="EUR">EUR</option>
                        <option value="USD">USD</option>
                    </select>
                </div>
            </div>
            <div class="field">
                <label for="bank">Jouw bank (in Suriname)</label>
                <select id="bank">
                    <option value="DSB">De Surinaamsche Bank (DSB)</option>
                    <option value="Hakrinbank">Hakrinbank</option>
                    <option value="Republic Bank">Republic Bank</option>
                    <option value="Fina Bank">Fina Bank</option>
                </select>
            </div>
            <div class="field">
                <label for="account">Jouw rekeningnummer</label>
                <input type="text" id="account" required placeholder="Bijv. 12.34.56.789">
            </div>
            <div class="field">
                <label for="description">Omschrijving</label>
                <input type="text" id="description" maxlength="200" placeholder="Bijv. Voor de boodschappen">
            </div>
            <button class="submit" type="submit" id="submitBtn">Maak Suritiki-link</button>
            <p id="statusMessage" class="message" role="alert"></p>
        </form>

        <section id="result" class="result hidden" aria-live="polite">
            <p class="result-title">Jouw Suritiki-link is klaar! 🎉</p>
            <input type="text" id="generatedLink" readonly aria-label="Gegenereerde link">
            <button id="copyBtn" class="copy" type="button">Kopieer link</button>
            <a id="whatsappBtn" class="whatsapp hidden" href="#" target="_blank" rel="noopener noreferrer">Deel via WhatsApp</a>
        </section>
    </main>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
