<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suritiki - Geld overmaken naar Suriname</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; font-family: Arial, sans-serif; color: #fff; background: linear-gradient(135deg, #075e54, #128c7e 50%, #25d366); }
        .flyer { width: 100%; max-width: 460px; padding: 42px 24px; text-align: center; border: 4px solid #fff; border-radius: 28px; background: rgba(0, 0, 0, .22); box-shadow: 0 18px 45px rgba(0, 0, 0, .3); }
        .badge { font-size: 50px; margin-bottom: 10px; }
        h1 { margin: 0; font-size: clamp(36px, 11vw, 62px); font-weight: 900; letter-spacing: 1px; text-shadow: 3px 3px 0 #075e54; }
        h2 { margin: 12px 0 22px; font-size: clamp(24px, 7vw, 36px); line-height: 1.1; text-transform: uppercase; }
        p { margin: 14px 0; font-size: 18px; line-height: 1.45; }
        .steps { margin: 24px 0; padding: 18px; border-radius: 16px; background: rgba(255, 255, 255, .16); font-size: 17px; font-weight: 700; }
        .whatsapp-button { display: block; width: 100%; padding: 18px 16px; border-radius: 14px; background: #fff; color: #075e54; font-size: 21px; font-weight: 900; text-decoration: none; text-transform: uppercase; box-shadow: 0 6px 0 #cfeee5; }
        .whatsapp-button:hover { transform: translateY(2px); box-shadow: 0 4px 0 #cfeee5; }
        .small { margin-top: 22px; font-size: 13px; opacity: .9; }
    </style>
</head>
<body>
    <main class="flyer">
        <div class="badge">🇸🇷 🇳🇱</div>
        <h1>SURITIKI</h1>
        <h2>Geld overmaken naar Suriname?</h2>
        <p>Snel en eenvoudig geld laten overmaken naar een Surinaamse bankrekening.</p>
        <div class="steps">1. Klik op de WhatsApp-knop<br>2. Stuur het bedrag dat je wilt overmaken<br>3. Je ontvangt daarna een Tikkie</div>
        <a class="whatsapp-button" href="https://wa.me/31626193693?text=Hoi%20Suritiki%2C%20ik%20wil%20geld%20overmaken%20naar%20Suriname.%20Het%20bedrag%20is%3A%20%E2%82%AC%20" target="_blank" rel="noopener noreferrer">💬 Stuur bedrag via WhatsApp</a>
        <p class="small">Je wordt direct doorgestuurd naar WhatsApp.</p>
    </main>
</body>
</html>
