<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suritiki - Maak betaalverzoek</title>
    <!-- We gebruiken Tailwind CSS voor een mooi, modern Tikkie-achtig design -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-lg p-6">
        <h1 class="text-3xl font-extrabold text-emerald-600 mb-1">Suritiki</h1>
        <p class="text-slate-500 text-sm mb-6">Maak makkelijk een betaalverzoek voor Suriname en Nederland.</p>
        
        <form id="paymentForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Jouw Naam (Ontvanger)</label>
                <input type="text" id="name" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Bijv. Deelsy">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Bedrag</label>
                <div class="flex space-x-2">
                    <input type="number" id="amount" required step="0.01" class="w-2/3 px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="0.00">
                    <select id="currency" class="w-1/3 px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="SRD">SRD</option>
                        <option value="EUR">EUR</option>
                        <option value="USD">USD</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Jouw Bank (in Suriname)</label>
                <select id="bank" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option value="DSB">De Surinaamsche Bank (DSB)</option>
                    <option value="Hakrinbank">Hakrinbank</option>
                    <option value="Republic Bank">Republic Bank</option>
                    <option value="Fina Bank">Fina Bank</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Jouw Rekeningnummer</label>
                <input type="text" id="account" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Bijv. 12.34.56.789">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Omschrijving</label>
                <input type="text" id="description" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Bijv. Voor de boodschappen">
            </div>

            <button type="submit" class="w-full bg-emerald-600 text-white font-semibold py-3 rounded-xl hover:bg-emerald-700 transition shadow-md">
                Maak Suritiki Link
            </button>
        </form>

        <!-- Dit stukje is eerst onzichtbaar, maar verschijnt als de link klaar is -->
        <div id="result" class="hidden mt-6 p-4 bg-emerald-50 border border-emerald-200 rounded-xl animate-fade-in">
            <p class="text-sm text-emerald-800 font-bold mb-1">Jouw Suritiki-link is klaar! 🎉</p>
            <input type="text" id="generatedLink" readonly class="w-full px-3 py-2 bg-white border border-emerald-300 rounded-lg text-sm text-slate-700 font-mono mb-3">
            <button id="copyBtn" class="w-full bg-slate-800 text-white text-sm font-medium py-2 rounded-lg hover:bg-slate-950 transition">
                Kopieer link
            </button>
        </div>
    </div>

    <!-- We koppelen hier ons logisc
