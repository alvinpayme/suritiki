<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suritiki - Betaalverzoek</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .card { background: #fff; width: 100%; max-width: 400px; border-radius: 16px; padding: 24px; box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.1); text-align: center; }
        h1 { margin: 0 0 20px; color: #059669; font-size: 24px; font-weight: 800; }
        .amount-box, .info-group { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .amount { font-size: 36px; font-weight: 900; color: #1e293b; margin: 4px 0; }
        .label { margin: 0; font-size: 11px; color: #94a3b8; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
        .desc { margin: 0; font-size: 14px; color: #64748b; }
        .info-group { text-align: left; margin-top: 24px; margin-bottom: 0; }
        .info-val { margin: 2px 0 0; font-size: 16px; font-weight: 600; color: #334155; overflow-wrap: anywhere; }
        .btn-abn { width: 100%; border: 0; border-radius: 12px; background: #006643; color: #fff; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; }
        .btn-abn:hover { background: #004d32; }
        .btn-abn:disabled { background: #94a3b8; cursor: not-allowed; }
        #statusMessage { margin-top: 10px; font-size: 14px; color: #dc2626; font-weight: 600; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Suritiki Betaalverzoek</h1>

        <div id="loading">Gegevens ophalen... 🔐</div>

        <div id="paymentContent" hidden>
            <div class="amount-box">
                <p class="label">Te betalen bedrag (omgerekend)</p>
                <p class="amount" id="displayAmount">€ 0,00</p>
                <p class="desc" id="displayDescription">-</p>
            </div>

            <p class="label">Betaal veilig via de betaal-link</p>
            <button id="payBtn" class="btn-abn" type="button">Open betaal-link 💳</button>

            <div class="info-group">
                <p class="label">Bestemd voor (in Suriname)</p>
                <p class="info-val" id="displayTarget">-</p>
            </div>
        </div>

        <div id="statusMessage" role="alert"></div>
    </main>

    <script src="config.js"></script>
    <script>
        (() => {
            const config = window.SURITIKI_CONFIG || {};
            const loading = document.getElementById('loading');
            const paymentContent = document.getElementById('paymentContent');
            const statusMessage = document.getElementById('statusMessage');
            const token = new URLSearchParams(window.location.search).get('token');

            const fail = (message) => {
                if (loading) loading.hidden = true;
                if (statusMessage) statusMessage.textContent = message;
            };

            if (!token) {
                fail('Ongeldige link. Er is geen geldige token gevonden.');
                return;
            }

            if (!config.SUPABASE_URL || !config.SUPABASE_KEY || config.SUPABASE_URL.includes('JOUW-PROJECT-REF')) {
                fail('De betaalpagina is nog niet geconfigureerd.');
                return;
            }

            const endpoint = `${config.SUPABASE_URL.replace(/\/$/, '')}/rest/v1/betaalverzoeken?public_token=eq.${encodeURIComponent(token)}&select=*`;

            fetch(endpoint, {
                headers: {
                    apikey: config.SUPABASE_KEY,
                    Authorization: `Bearer ${config.SUPABASE_KEY}`,
                    'x-public-token': token
                }
            })
            .then(async (response) => {
                const data = await response.json().catch(() => null);
                if (!response.ok) {
                    throw new Error(data?.message || `HTTP ${response.status}`);
                }
                return data;
            })
            .then((data) => {
                const verzoek = Array.isArray(data) ? data[0] : null;
                if (!verzoek) {
                    throw new Error('Betaalverzoek niet gevonden.');
                }

                const amount = Number(verzoek.bedrag ?? verzoek.amount ?? 0);
                document.getElementById('displayAmount').textContent = `€ ${Number.isFinite(amount) ? amount.toFixed(2).replace('.', ',') : '0,00'}`;
                document.getElementById('displayDescription').textContent = verzoek.omschrijving ?? verzoek.description ?? '-';
                document.getElementById('displayTarget').textContent = [
                    verzoek.naam,
                    verzoek.bank,
                    verzoek.rekeningnummer
                ].filter(Boolean).join(' · ') || verzoek.bestemd_voor || verzoek.target || '-';

                const paymentUrl = verzoek.betaallink ?? verzoek.payment_url ?? verzoek.tikkie_url;
                const payBtn = document.getElementById('payBtn');

                if (!paymentUrl) {
                    payBtn.disabled = true;
                    payBtn.textContent = 'Geen betaal-link beschikbaar';
                } else {
                    payBtn.addEventListener('click', () => {
                        window.open(paymentUrl, '_blank', 'noopener,noreferrer');
                    });
                }

                if (loading) loading.hidden = true;
                if (paymentContent) paymentContent.hidden = false;
            })
            .catch(() => {
                fail('De gegevens konden niet worden opgehaald.');
            });
        })();
    </script>
</body>
</html>
