<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suritiki - Betaalverzoek</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .card { background: white; width: 100%; max-width: 400px; padding: 24px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,.1); text-align: center; }
        h1 { color: #059669; font-size: 24px; margin: 0 0 20px; }
        .amount-box, .info-group { background: #f8fafc; border: 1px solid #e2e8f0; padding: 16px; border-radius: 12px; margin-bottom: 16px; }
        .amount { font-size: 36px; font-weight: 900; color: #1e293b; margin: 4px 0; }
        .label { font-size: 11px; color: #94a3b8; font-weight: 700; letter-spacing: .05em; margin: 0; text-transform: uppercase; }
        .desc { font-size: 14px; color: #64748b; margin: 0; }
        .info-group { text-align: left; margin-top: 24px; margin-bottom: 0; }
        .info-val { font-size: 16px; font-weight: 600; color: #334155; margin: 2px 0 0; overflow-wrap: anywhere; }
        .btn-abn { width: 100%; background: #006643; color: white; border: 0; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; }
        .btn-abn:hover { background: #004d32; }
        .btn-abn:disabled { background: #94a3b8; cursor: not-allowed; }
        #statusMessage { color: #dc2626; margin-top: 10px; font-weight: 600; font-size: 14px; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Suritiki Betaalverzoek</h1>
        <div id="loading">Gegevens ophalen... 🔐</div>
        <div id="paymentContent" hidden>
            <div class="amount-box">
                <p class="label">Te betalen bedrag (omgerekend)</p>
                <p class="amount" id="displayAmount">€ 0,00</p>
                <p class="desc" id="displayDescription">-</p>
            </div>
            <p class="label">Betaal veilig via de betaal-link</p>
            <button class="btn-abn" id="payBtn" type="button">Open betaal-link 💳</button>
            <div class="info-group">
                <p class="label">Bestemd voor (in Suriname)</p>
                <p class="info-val" id="displayTarget">-</p>
            </div>
        </div>
        <div id="statusMessage" role="alert"></div>
    </main>
    <script src="config.js"></script>
    <script>
        (() => {
            const config = window.SURITIKI_CONFIG || {};
            const loading = document.getElementById('loading');
            const content = document.getElementById('paymentContent');
            const status = document.getElementById('statusMessage');
            const id = new URLSearchParams(window.location.search).get('id');
            const fail = (message) => { loading.hidden = true; status.textContent = message; };
            if (!id) return fail('Ongeldige link. Er is geen betaal-ID gevonden.');
            if (!config.SUPABASE_URL || !config.SUPABASE_KEY || config.SUPABASE_URL.includes('JOUW-PROJECT-REF')) return fail('De betaalpagina is nog niet geconfigureerd.');

            const endpoint = `${config.SUPABASE_URL.replace(/\/$/, '')}/rest/v1/betaalverzoeken?id=eq.${encodeURIComponent(id)}&select=*`;
            fetch(endpoint, { headers: { apikey: config.SUPABASE_KEY, Authorization: `Bearer ${config.SUPABASE_KEY}` } })
                .then(async (response) => {
                    const data = await response.json().catch(() => null);
                    if (!response.ok) throw new Error(data?.message || `HTTP ${response.status}`);
                    return data;
                })
                .then((data) => {
                    const verzoek = Array.isArray(data) ? data[0] : null;
                    if (!verzoek) throw new Error('Betaalverzoek niet gevonden.');
                    const amount = Number(verzoek.bedrag ?? verzoek.amount);
                    document.getElementById('displayAmount').textContent = `€ ${Number.isFinite(amount) ? amount.toFixed(2).replace('.', ',') : '0,00'}`;
                    document.getElementById('displayDescription').textContent = verzoek.omschrijving ?? verzoek.description ?? '-';
                    document.getElementById('displayTarget').textContent = [verzoek.naam, verzoek.bank, verzoek.rekeningnummer].filter(Boolean).join(' · ') || verzoek.bestemd_voor || verzoek.target || '-';
                    const paymentUrl = verzoek.betaallink ?? verzoek.payment_url ?? verzoek.tikkie_url;
                    const button = document.getElementById('payBtn');
                    if (!paymentUrl) { button.disabled = true; button.textContent = 'Geen betaal-link beschikbaar'; }
                    else button.addEventListener('click', () => window.open(paymentUrl, '_blank', 'noopener,noreferrer'));
                    loading.hidden = true;
                    content.hidden = false;
                })
                .catch((error) => fail(error.message === 'Betaalverzoek niet gevonden.' ? error.message : 'De gegevens konden niet worden opgehaald.'));
        })();
    </script>
</body>
</html>
